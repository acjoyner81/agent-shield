services:
  redis:
    image: redis:7-alpine
    container_name: agentshield-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-java:
    build: ./java-services/gateway-java
    container_name: agentshield-java-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${AUTH0_ISSUER:-https://dev-zymaiayb0afkpn7n.us.auth0.com/}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: ${AUTH0_AUDIENCE:-https://api.agentshield.local}
    depends_on:
      redis:
        condition: service_healthy

  gateway-python:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: agentshield-python-gateway
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-zymaiayb0afkpn7n.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.agentshield.local}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://dev-zymaiayb0afkpn7n.us.auth0.com/}
      DEV_MODE: "true"
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:4200/billing/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:4200/billing/cancel}
    depends_on:
      redis:
        condition: service_healthy

  mcp-server:
    build: ./java-services/mcp-server
    container_name: agentshield-mcp-java
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  splunk:
    image: splunk/splunk:latest
    platform: linux/amd64
    container_name: agentshield-splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD in .env}
    ports:
      - "8001:8000"
      - "8088:8088"
    depends_on:
      redis:
        condition: service_healthy

  telemetry-aggregator:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["python", "-m", "gateway.aggregator"]
    container_name: agentshield-telemetry-aggregator
    environment:
      REDIS_URL: redis://redis:6379/0
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-http://splunk:8088/services/collector/raw}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN in .env}
    depends_on:
      redis:
        condition: service_healthy
      splunk:
        condition: service_started
    restart: unless-stopped

  portal-frontend:
    build:
      context: ./portal-frontend  # Update path if your UI folder is named differently (e.g., ./ui or ./web)
      dockerfile: Dockerfile
    container_name: agentshield-frontend
    ports:
      - "4200:80"  # Exposes web UI on http://localhost:4200 (change to "3000:3000" for React/Vite dev mode)
    environment:
      - API_URL=http://localhost:8000
    depends_on:
      - gateway-python
      - gateway-java

  tripwire:
    build:
      context: ./tripwire
      dockerfile: Dockerfile
    container_name: agent-shield-tripwire
    # Tripwire bakes $(HOSTNAME) into its local key and baseline DB names at
    # config compile time. Docker's default hostname is the container ID, which
    # changes on every recreate, so a persisted tripwire-keys volume would no
    # longer match the keys and twadmin would re-prompt to overwrite site.key
    # forever. Pin it so the keys and baseline stay valid across restarts.
    hostname: agentshield-fim
    # Tripwire's report output is unbounded; without a cap it filled the Docker
    # VM disk once already (1.8 GB json log) and broke builds.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Mount application code & configurations read-only for file integrity monitoring
      - ./gateway:/mnt/gateway:ro
      - ./java-services:/mnt/java-services:ro
      - ./portal-frontend/nginx.conf:/mnt/nginx.conf:ro
      - ./config:/mnt/config:ro
      - tripwire-data:/var/lib/tripwire
      - tripwire-keys:/etc/tripwire
    environment:
      - SITE_KEY_PASSPHRASE=${TRIPWIRE_SITE_KEY:-AgentShieldSiteKey123!}
      - LOCAL_KEY_PASSPHRASE=${TRIPWIRE_LOCAL_KEY:-AgentShieldLocalKey123!}
      - CHECK_INTERVAL_SECONDS=300
    depends_on:
      - gateway-python
      - gateway-java

volumes:
  redis-data:
  tripwire-data:
  tripwire-keys:

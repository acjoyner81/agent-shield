# AgentShield Splunk Saved Searches
# Repo-owned. The entrypoint-wrapper stages this directory into
# /opt/splunk/etc/apps/agent-shield-apps at every boot, so a wipe of the
# splunk-etc volume is self-healing and edits here take effect on restart.
# Do not edit these definitions inside the container; edit here.

[Error_rate_by_data_path]
disabled = 0
search = index=main earliest=-15m | stats count by data.path | where count > 0 | sort -count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
alert.actions = rtsearch

[Volume_by_tenant_id]
disabled = 0
search = index=main | stats count by tenant_id | sort -count
dispatch.earliest_time = -1d
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
alert.actions = rtsearch

[Alert_for_agentshield_security_events]
disabled = 0
search = index=main sourcetype=agentshield.security.* | table _time, source, host, event
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
alert.actions = rtsearch

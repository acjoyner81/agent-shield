server:
  port: 8080

spring:
  application:
    name: gateway-java
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER:https://dev-zymaiayb0afkpn7n.us.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://api.agentshield.local}
  cloud:
    gateway:
      routes:
        - id: portal-frontend-api
          uri: ${PYTHON_GATEWAY_URL:http://gateway-python:8000}
          predicates:
            - Path=/api/v1/**

        # No RequestRateLimiter here on purpose (G-AC-2). Python owns the single
        # tenant token bucket, so a request that Python would throttle returns
        # Python's 429 unchanged and the edge never enforces a second budget.
        - id: fastapi-llm-proxy
          uri: ${PYTHON_GATEWAY_URL:http://gateway-python:8000}
          predicates:
            - Path=/v1/chat/**

        - id: spring-ai-mcp-tools
          uri: ${MCP_SERVER_URL:http://mcp-server:8081}
          predicates:
            - Path=/mcp/**

        - id: angular-dev-server
          uri: ${PORTAL_FRONTEND_URL:http://portal-frontend:80}
          predicates:
            - Path=/**
  data:
    redis:
      host: redis
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

spring:
  application:
    name: agentshield-mcp-server
  main:
    web-application-type: reactive
  ai:
    mcp:
      server:
        name: agentshield-mcp-server
        version: 0.1.0-SNAPSHOT
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp/v1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://dev-zymaiayb0afkpn7n.us.auth0.com/}
          audiences: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES:https://api.agentshield.local}
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
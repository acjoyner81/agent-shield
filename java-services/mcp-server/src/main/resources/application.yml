spring:
  application:
    name: agentshield-mcp-server
  main:
    web-application-type: reactive
  ai:
    mcp:
      server:
        name: agentshield-mcp-server
        version: 0.1.0-SNAPSHOT
        webflux:
          base-path: /mcp/v1
  cloud:
    gateway:
      routes:
        - id: fastapi-chat-route
          uri: http://localhost:${wiremock.server.port:8000}
          predicates:
            - Path=/v1/chat/completions
          filters:
            - StripPrefix=2
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info